<script>
(() => {
"use strict";

/* ================================================================
   MellorsOS Kernel
   UI shell + MScript runtime. Every built-in app below is MScript.
   ================================================================ */
const $ = s => document.querySelector(s);
const root = $('#appRoot');
const device = $('#device');
const STORAGE_PREFIX = 'mellorsos.';
const state = {
  current:null, history:[], recents:[], notifications:[], appInstances:new Map(),
  background:new Map(), eventBus:new Map(), logs:[], developer:false
};
const defaults = {
  accent:'#6d7cff', accent2:'#a96cff', wallpaper:'aurora', gridCols:4, iconSize:58, iconShape:'squircle',
  showAppLabels:true, homeTitle:'MellorsOS', homeSubtitle:'Programmable by design', username:'Owner',
  fontScale:1, compact:false, highContrast:false, reduceMotion:false, reduceTransparency:false, largeTargets:false, boldText:false,
  haptics:true, showSeconds:false, clock24h:false, showBattery:true, showStatusIcons:true, navCompact:false,
  notificationToasts:true, notificationPreview:true, notificationLimit:50, developerMode:false, showFPS:false
};
const memoryStorage = new Map();
function storageKeys(){ try{return Object.keys(localStorage);}catch{return [...memoryStorage.keys()];} }
const store = {
  rawGet(k, fallback=null){
    const key=STORAGE_PREFIX+k;
    try{const v=localStorage.getItem(key);if(v!==null)return JSON.parse(v);}catch{}
    try{return memoryStorage.has(key)?JSON.parse(memoryStorage.get(key)):fallback;}catch{return fallback;}
  },
  rawSet(k,v){const key=STORAGE_PREFIX+k, encoded=JSON.stringify(v);try{localStorage.setItem(key,encoded);}catch{memoryStorage.set(key,encoded);}return v;},
  rawDelete(k){const key=STORAGE_PREFIX+k;try{localStorage.removeItem(key);}catch{}memoryStorage.delete(key);},
  keys(prefix=''){return storageKeys().filter(k=>k.startsWith(STORAGE_PREFIX+prefix)).map(k=>k.slice(STORAGE_PREFIX.length));},
  clearAll(){storageKeys().filter(k=>k.startsWith(STORAGE_PREFIX)).forEach(k=>{try{localStorage.removeItem(k);}catch{}memoryStorage.delete(k);});}
};

/* ---------------------- MellorsOS virtual filesystem ---------------------- */
const FILESYSTEM_KEY='filesystem';
const FILESYSTEM_VERSION=1;
const FILESYSTEM_CORE_FOLDERS=['/','/apps','/imports','/studio','/documents'];
function fsNormalize(path){
  let raw=String(path??'').replace(/\\/g,'/').trim();
  if(!raw)raw='/';
  if(!raw.startsWith('/'))raw='/'+raw;
  const parts=[];
  for(const part of raw.split('/')){
    if(!part||part==='.')continue;
    if(part==='..'){parts.pop();continue;}
    parts.push(part.replace(/[\u0000-\u001f\u007f]/g,''));
  }
  const out='/'+parts.filter(Boolean).join('/');
  if(out.length>768)throw new MScriptError('File path is too long');
  return out||'/';
}
function fsParent(path){const p=fsNormalize(path);if(p==='/')return'/';const i=p.lastIndexOf('/');return i<=0?'/':p.slice(0,i);}
function fsName(path){const p=fsNormalize(path);return p==='/'?'/':p.slice(p.lastIndexOf('/')+1);}
function fsExtension(path){const n=fsName(path);const i=n.lastIndexOf('.');return i<=0?'':n.slice(i+1).toLowerCase();}
function fsAppRoot(appId){return fsNormalize('/apps/'+String(appId));}
function fsNew(){const now=Date.now(),entries={};for(const p of FILESYSTEM_CORE_FOLDERS)entries[p]={kind:'folder',owner:'system',created:now,modified:now};return{version:FILESYSTEM_VERSION,entries};}
function fsLoad(){
  let fs=store.rawGet(FILESYSTEM_KEY,null);
  if(!fs||typeof fs!=='object'||!fs.entries||typeof fs.entries!=='object')fs=fsNew();
  let changed=false,now=Date.now();
  for(const p of FILESYSTEM_CORE_FOLDERS)if(!fs.entries[p]||fs.entries[p].kind!=='folder'){fs.entries[p]={kind:'folder',owner:'system',created:now,modified:now};changed=true;}
  fs.version=FILESYSTEM_VERSION;
  if(changed)store.rawSet(FILESYSTEM_KEY,fs);
  return fs;
}
function fsSave(fs){store.rawSet(FILESYSTEM_KEY,fs);return fs;}
function fsEnsureFolderIn(fs,path,owner='system'){
  path=fsNormalize(path);let current='';const now=Date.now();
  if(path==='/'){if(!fs.entries['/'])fs.entries['/']={kind:'folder',owner,created:now,modified:now};return'/';}
  for(const part of path.slice(1).split('/')){
    current+='/'+part;
    const entry=fs.entries[current];
    if(entry&&entry.kind!=='folder')throw new MScriptError(`A file already exists at ${current}`);
    if(!entry)fs.entries[current]={kind:'folder',owner,created:now,modified:now};
  }
  return path;
}
function fsEnsureFolder(path,owner='system'){const fs=fsLoad();const out=fsEnsureFolderIn(fs,path,owner);fsSave(fs);return out;}
function fsEntry(path){return fsLoad().entries[fsNormalize(path)]||null;}
function fsWritePath(path,content,mime='text/plain',owner='user',encoding='text'){
  path=fsNormalize(path);if(path==='/')throw new MScriptError('Cannot write a file at the filesystem root');
  const fs=fsLoad(),parent=fsParent(path);fsEnsureFolderIn(fs,parent,owner);
  if(fs.entries[path]?.kind==='folder')throw new MScriptError(`A folder already exists at ${path}`);
  const now=Date.now(),old=fs.entries[path];
  fs.entries[path]={kind:'file',content:String(content??''),mime:String(mime||'application/octet-stream'),encoding:String(encoding||'text'),owner:String(owner||'user'),created:old?.created||now,modified:now};
  fs.entries[parent].modified=now;fsSave(fs);return path;
}
function fsMkdirPath(path,owner='user'){const fs=fsLoad();path=fsEnsureFolderIn(fs,path,owner);fs.entries[path].modified=Date.now();fsSave(fs);return path;}
function fsReadPath(path,fallback=''){const e=fsEntry(path);return e?.kind==='file'?e.content:fallback;}
function fsChildren(path){

function apiReferenceHTML(rt){
  const groups=[];
  for(const [ns,obj] of Object.entries(rt.api)){
    if(typeof obj==='function'){groups.push({name:'Top-level',items:[[ns,obj]]});continue;}
    if(!obj||typeof obj!=='object')continue;
    const items=Object.entries(obj).filter(([,fn])=>typeof fn==='function').map(([name,fn])=>[`${ns}.${name}`,fn]);
    if(items.length)groups.push({name:ns,items});
  }
  groups.sort((a,b)=>a.name.localeCompare(b.name));
  return groups.map(group=>{
    const cards=group.items.sort((a,b)=>a[0].localeCompare(b[0])).map(([path,fn])=>{
      const src=Function.prototype.toString.call(fn);const m=src.match(/^[^(]*\(([^)]*)\)/);const params=(m?m[1]:'').split(',').map(x=>x.trim()).filter(Boolean);
      const paramRows=params.length?params.map(raw=>{const name=raw.split('=')[0].trim(),def=raw.includes('=')?raw.slice(raw.indexOf('=')+1).trim():'';return `<div class="row" style="align-items:flex-start"><div class="row-main"><div class="row-title">${escapeHTML(name)} <span class="small">· ${escapeHTML(apiParamType(path,name))}</span></div><div class="row-sub">${escapeHTML(apiParamDescription(path,name))}${def?` Default: ${escapeHTML(def)}.`:''}</div><div class="row-sub" style="margin-top:4px"><strong>Quotes:</strong> ${escapeHTML(apiParamQuoteRule(path,name))}</div></div></div>`;}).join(''):'<div class="row-sub"><strong>Parameters:</strong> none. Nothing goes inside the parentheses.</div>';
      return `<div class="card"><pre class="code" style="margin-top:0">${escapeHTML(path+'('+params.join(', ')+')')}</pre><div class="row-sub" style="margin:8px 0 10px">${escapeHTML(apiFunctionSummary(path))}</div>${paramRows}</div>`;
    }).join('');
    return `<div class="section-title">${escapeHTML(group.name)} parameters</div>${cards}`;
  }).join('');
}

        replace(v,a,b){return String(v).split(String(a)).join(String(b));},slice(v,start,end){return String(v).slice(Number(start),end===undefined?undefined:Number(end));},
        indexOf(v,q){return String(v).indexOf(String(q));},part(v,separator,index){return String(v).split(String(separator))[Number(index)]??'';},
        count(v,separator='|'){return String(v)===''?0:String(v).split(String(separator)).length;},repeat(v,count){return String(v).repeat(Math.max(0,Math.min(1000,Number(count)||0)));}
      },
      json:{
        stringify(v){return JSON.stringify(v);},parse(v){return JSON.parse(v);},
        get(v,key,fallback=''){try{const o=typeof v==='string'?JSON.parse(v):v;return o?.[String(key)]??fallback;}catch{return fallback;}},
        set(v,key,value){let o={};try{o=typeof v==='string'?JSON.parse(v):v||{};}catch{}o[String(key)]=value;return JSON.stringify(o);}
      },
      value:{number(v){return Number(v);},string(v){return String(v);},bool(v){return !!v;},type(v){return Array.isArray(v)?'array':v===null?'null':typeof v;}},
      toast
    };
  }
  uid(id){return `ms-${this.app.meta.id}-${id}`.replace(/[^\w-]/g,'_');}
}
function showRuntimeError(app,e){log(`Error in ${app.meta.name}: ${e.message} line ${e.line||'?'}`);root.innerHTML=`<section class="screen"><div class="app-page"><div class="app-header"><div class="app-header-icon" style="background:#b03b55">!</div><div><div class="app-header-title">MScript Error</div><div class="app-header-sub">${escapeHTML(app.meta.name)}</div></div></div><div class="card"><div class="row-title">${escapeHTML(e.message)}</div><div class="row-sub">Line ${e.line||'unknown'}</div></div><pre class="code">${escapeHTML(app.source.split('\n').map((l,i)=>`${String(i+1).padStart(3)}  ${l}`).join('\n'))}</pre></div></section>`;}
function crashForPermission(rt,e){const app=rt.app;log(`${app.meta.name} crashed: ungranted permission ${e.permission}`);rt.destroy();stopAppBackground(app.meta.id);state.appInstances.delete(app.meta.id);state.recents=state.recents.filter(id=>id!==app.meta.id);notify('MScript',`${app.meta.name} crashed due to an ungranted permission: ${permissionLabel(e.permission)}.`, 'system');if(state.current===app.meta.id)renderHome();}
function backgroundStart(rt,name,ms,eventName){const key=`${rt.app.meta.id}:${name}`;backgroundStop(rt.app.meta.id,name);const id=setInterval(()=>{if(!hasPermission(rt.app,'background')){crashForPermission(rt,new PermissionDeniedError('background'));return;}rt.trigger(eventName,{type:'background',name,time:Date.now()});},Math.max(250,ms));state.background.set(key,id);rt.timerNames.add(name);log(`Background process started: ${key} every ${ms}ms`);}
function backgroundStop(appId,name){const key=`${appId}:${name}`,id=state.background.get(key);if(id){clearInterval(id);state.background.delete(key);log(`Background process stopped: ${key}`);}}

SYSTEM_SOURCES.files = String.raw`app "Files"
meta id "files"
meta icon "📁"
meta color "#4f91e8"
meta version "1.0 Release"

function renderBrowser()
  let viewing = ""
  ui.clear()
  ui.header("Files", currentPath)
  ui.fileInput("importFile", "Import file", "*/*")
  ui.input("folderName", "New folder name", "")
  ui.button("newFolder", "Create folder", "secondary")
  ui.fileBrowser(currentPath)

function renderViewer(path)
  let viewing = path
  ui.clear()
  ui.header(file.name(path), path)
  ui.button("viewerBack", "← Back to folder", "ghost")
  ui.infoRow("Type", file.mime(path))
  ui.infoRow("Size", file.size(path) + " bytes")
  ui.infoRow("Modified", file.modified(path))
  ui.section("Contents")
  ui.code(file.read(path, "This file has no readable text content."))
end

on start
  let currentPath = data.get("currentPath", "/")
  let viewing = ""
  renderBrowser()
end

on back
  if viewing != ""
    renderBrowser()
    return true
  end
  if currentPath != "/"
    set currentPath = file.parent(currentPath)
    data.set("currentPath", currentPath)
    renderBrowser()
    return true
  end
  return false
end

on click viewerBack
  renderBrowser()
end

on click newFolder
  let name = ui.value("folderName")
  if name == ""
    system.toast("Enter a folder name")
  else
    file.mkdir(currentPath + "/" + name)
    renderBrowser()
  end
end

on file importFile
  set currentPath = "/imports"
  data.set("currentPath", currentPath)
  system.toast("Imported to " + event.filePath)
  renderBrowser()
end

on fileNavigate
  set currentPath = event.path
  data.set("currentPath", currentPath)
  renderBrowser()
end

on fileAction
  if event.action == "edit"
    data.globalSet("studio.openPath", event.path)
    app.open("studio")
  else
    if event.action == "install"
      app.install(file.read(event.path, ""))
    else
      if event.action == "delete"
        if dialog.danger("Delete file?", "Permanently delete " + event.name + "?", event.path)
          file.delete(event.path)
          renderBrowser()
        end
      else
        if event.action == "open"
          renderViewer(event.path)
        end
      end
    end
  end
end`;

SYSTEM_SOURCES.guide = String.raw`app "MScript Guide"
meta id "guide"
meta icon "📘"
meta color "#4d79e6"
meta version "1.0 Release"

on start
  ui.header("MScript Guide", "Complete MScript 1.0 Release language and API reference")
  ui.alert("Everything here is MScript", "System apps and user apps use the same language. Built-in apps are trusted; user apps must request protected permissions. Superuser ownership is enforced by the MellorsOS kernel, not by Settings.", "info")

  ui.section("1 · App structure")
  ui.text("Every app begins with app metadata, then optional functions and event handlers. Statements inside events and functions execute from top to bottom.")
  ui.code("app \"My App\"\nmeta id \"my.app\"\nmeta icon \"◆\"\nmeta color \"#6d7cff\"\nmeta version \"1.0 Release\"\n\nfunction greet(name)\n  return \"Hello \" + name\nend\n\non start\n  ui.header(\"My App\", greet(\"MellorsOS\"))\nend")
  ui.text("app sets the display name. meta id must uniquely identify the app. meta icon, color, and version control Home-screen and app-header metadata. A custom distribution may change built-in MScript sources, but kernel security rules still apply.", "small")

  ui.section("2 · Comments, values, variables, and operators")
  ui.code("# A comment occupies its own line\nlet score = 10\nset score = score + 5\nlet name = \"MellorsOS\"\nlet enabled = true\nlet empty = null\n\n# Operators\n+  -  *  /  %\n==  !=  <  >  <=  >=\n&&  ||  !")
  ui.text("let and set both assign a variable. Strings use single or double quotes and support \\n, \\t, and \\r escapes. Numbers, true, false, and null are literals. + adds numbers or concatenates when either side is text. Parentheses control expression order. Dotted names such as event.value read properties or API namespaces; function arguments are comma-separated.", "small")

  ui.section("3 · Conditions and loops")
  ui.code("if score >= 10\n  system.toast(\"High score\")\nelse\n  system.toast(\"Keep going\")\nend\n\nlet i = 0\nwhile i < 5\n  set i = i + 1\nend\n\nrepeat 3\n  system.log(index)\nend\n\nfor n from 1 to 5\n  if n == 3\n    continue\n  end\n  if n == 5\n    break\n  end\nend")
  ui.text("if evaluates an expression and optionally runs an else block. while repeats while its condition remains true. repeat count runs a block a fixed number of times and exposes zero-based index. for variable from start to end counts inclusively upward or downward. break exits the nearest loop and continue skips to its next iteration. MellorsOS caps loops and statement execution to protect the emulator.", "small")

  ui.section("4 · Functions and return")
  ui.code("function add(a, b)\n  return a + b\nend\n\non start\n  let result = add(2, 3)\nend")
  ui.text("function name(arguments) defines reusable MScript code. Parameters are local inputs. return ends that function and supplies a value to the caller.", "small")

  ui.section("5 · Events")
  ui.code("on start ... end\non resume ... end\non pause ... end\non close ... end\non back ... end\non homeButton ... end\non recentsButton ... end\non click buttonId ... end\non click ... end\non input fieldId ... end\non input ... end\non change controlId ... end\non change ... end\non dataChange ... end\non settingsChange ... end")
  ui.text("start runs when the app mounts. resume follows start when an app opens. pause runs before navigation leaves the app. close runs when its runtime is destroyed. back, homeButton, and recentsButton fire from the navigation bar; returning true from those navigation events consumes the default action. click, input, and change are generated by UI controls. ui.fileInput generates file id and generic file events; the selected file is preserved in /imports. event.value contains text or a data URL, while event.fileName, event.fileType, event.filePath, event.fileEncoding, event.size, and event.lastModified describe it. event.id, event.value, event.type, event.key, event.reason, and similar fields describe other events.", "small")
  ui.code("timer.after(\"welcome\", 1000, \"welcomeTimer\")\nbackground.start(\"sync\", 5000, \"syncTick\")\nevents.emit(\"customEvent\", \"hello\")\n\non welcomeTimer\n  system.toast(event.name)\nend\n\non syncTick\n  system.log(\"Background tick\")\nend\n\non customEvent\n  system.toast(event.value)\nend")
  ui.text("Timer, background, and custom event names are arbitrary. App Manager also emits permissionChange, appVisibility, and uninstallManagedApp to the app hosting ui.appManager(). Specialized widgets emit wallpaper, accent, key, openNote, fileNavigate, and fileAction. Successful file API modifications emit fileChange.", "small")

  ui.section("6 · Permission model")
  ui.code("permission.ask(\"settings\")\npermission.ask(\"notifications\")\npermission.ask(\"installApps\")\npermission.ask(\"modifyPermissions\")\npermission.ask(\"allFiles\")\npermission.ask(\"background\")\npermission.ask(\"superuser\")")
  ui.text("User apps start without protected permissions. permission.ask displays a MellorsOS-native prompt and returns true or false. Put permission.ask before other side effects in the handler because the handler resumes after the user answers. Calling a protected command without its permission crashes and exits the user app with an MScript crash notification.", "small")
  ui.code("if permission.ask(\"notifications\")\n  notify.send(\"Hello\", \"Allowed\")\nelse\n  system.toast(\"Using fallback UI\")\nend")
  ui.text("settings protects settings.set, settings.toggle, and settings.reset. notifications protects notification modification. installApps protects app.install and app.remove. modifyPermissions protects permission.set and ui.appManager. allFiles protects absolute filesystem paths outside the app's own /apps/<id> folder. background protects background.start. Superuser bypasses protected permissions and adds kernel ownership powers.", "small")

  ui.section("7 · Superuser security")
  ui.text("Only one user app can hold Superuser. It can only be granted when that app itself calls permission.ask(\"superuser\") and the user completes multiple warnings. Settings cannot grant, revoke, transfer, or directly uninstall the holder. No other MScript app, including a built-in or custom Settings app, can disable the holder. The holder relinquishes with permission.disableSuperuser(), or factory reset removes it.")
  ui.text("Superuser can uninstall built-in system apps with app.remove(id), install replacements even using a built-in app id with app.install(source), and restore the original built-in with app.restoreSystem(id). Kernel-owned permissions, installed-app records, and disabled-system-app records cannot be overwritten through data.globalSet.", "small")

  ui.section("8 · UI creation API")
  ui.code("ui.clear()\nui.header(title, subtitle)\nui.section(title)\nui.text(text, style)\nui.rich(title, body, icon)\nui.card(title, body)\nui.menu(id, title, subtitle, icon, value)\nui.alert(title, body, kind)\nui.divider()\nui.spacer(px)\nui.badge(text, kind)\nui.stat(label, value)\nui.progress(title, value, max)\nui.label(id, text, style)\nui.infoRow(title, value, subtitle)")
  ui.text("clear rebuilds the app page as a blank content surface. header explicitly creates or updates the sticky app header; custom apps do not receive an automatic header unless their MScript calls ui.header(). section creates a section heading. text and label render escaped text; label has an id for later mutation. rich/card/infoRow create information surfaces. menu creates a tappable Settings-style row and fires click id. alert kinds are info, warning, danger, or success. divider/spacer control layout. badge/stat/progress display compact status information.", "small")

  ui.section("9 · UI input API")
  ui.code("ui.button(id, label, kind)\nui.input(id, label, value, type)\nui.numberInput(id, label, value, min, max, step)\nui.password(id, label, value)\nui.search(id, label, value)\nui.colorInput(id, label, value)\nui.dateInput(id, label, value)\nui.timeInput(id, label, value)\nui.textarea(id, label, value, placeholder)\nui.codeEditor(id, value)\nui.toggle(id, title, on, subtitle)\nui.slider(id, title, value, min, max, step)\nui.select(id, title, value, \"a:Label A|b:Label B\")\nui.segmented(id, title, value, options)\nui.chips(id, title, selected, options)")
  ui.text("The id parameter names a control and connects it to events. You may write it as a quoted string, such as ui.button(\"save\", ...), or as a bare identifier, such as ui.button(save, ...); both connect to on click save. button kinds are primary, secondary, danger, or ghost. input type accepts normal HTML input types while the dedicated helpers cover common types. toggle, slider, select, segmented, and chips fire change id plus the generic change event. input and numberInput fire input id plus generic input. textarea fires input id. fileInput opens a user-controlled file chooser and fires file id after the selected text has been read; literal id, label, and accept values should be quoted, except control IDs may also use bare identifiers. Read current control contents with ui.value(id).", "small")

  ui.section("10 · UI mutation API")
  ui.code("ui.value(id)\nui.setValue(id, value)\nui.clearValue(id)\nui.setText(id, text)\nui.setVisible(id, visible)\nui.setEnabled(id, enabled)\nui.remove(id)\nui.exists(id)\nui.focus(id)\nui.scrollTop()")
  ui.text("These functions inspect or modify controls already rendered on the current app page. setText is intended for elements created with ui.label or other id-bearing controls. setVisible hides without deleting. setEnabled disables interaction. remove deletes the element. focus moves keyboard focus. scrollTop returns to the top of the app page.", "small")

  ui.section("11 · Specialized system UI helpers")
  ui.code("ui.code(text)\nui.fileInput(id, label, accept)\nui.noteList(prefix)\nui.appList()\nui.storageView()\nui.notificationList()\nui.calculator()\nui.calcSet(value)\nui.wallpaperPicker()\nui.accentPicker()\nui.logView()\nui.appManager()\nui.refreshAppManager()\nui.html(htmlFile)\nui.htmlSafe(text)")
  ui.text("code renders a formatted code block. fileInput opens a browser file chooser, preserves the selected file in /imports, and emits on file <id>; event.filePath identifies the stored import. fileBrowser renders folders and emits fileNavigate or fileAction. noteList lists storage records and emits openNote. appList opens installed apps. storageView, notificationList, calculator/calcSet, wallpaperPicker, accentPicker, and logView power built-in tools. appManager requires Modify permissions and renders app permissions, Home visibility, and uninstall controls while keeping Superuser kernel-controlled. refreshAppManager updates it in place. ui.html runs a complete HTML/CSS/JavaScript or WebAssembly document in an internet-capable sandbox while MellorsOS keeps its status and navigation bars visible. External scripts, styles, images, media, fetch/XHR, WebSockets, pointer lock, fullscreen, and gamepads are supported. The sandbox cannot access the MellorsOS parent DOM, kernel, permissions, cookies, or browser storage. fetch/XHR requests remain subject to the destination server's CORS policy. htmlSafe displays text inside a card and always escapes markup.", "small")

  ui.section("12 · Private and shared storage")
  ui.code("data.get(key, fallback)\ndata.set(key, value)\ndata.delete(key)\ndata.keys(prefix)\ndata.has(key)\ndata.clear()\ndata.count(prefix)\ndata.append(key, value, separator)\ndata.increment(key, amount)\ndata.globalGet(key, fallback)\ndata.globalSet(key, value)\ndata.globalDelete(key)\ndata.globalKeys(prefix)\ndata.globalHas(key)")
  ui.text("Private data functions automatically namespace records to the current app. keys returns | separated key names. clear only clears the current app's private data. append concatenates text and increment updates a numeric record. Ordinary user apps' global functions are sandboxed under shared.*. Built-in apps and Superuser can address broader OS storage, except kernel-owned trust records.", "small")

  ui.section("13 · Filesystem API")
  ui.code("file.root()\nfile.resolve(path)\nfile.read(path, fallback)\nfile.write(path, content, mime)\nfile.append(path, content)\nfile.delete(path)\nfile.exists(path)\nfile.mkdir(path)\nfile.list(path)\nfile.listPaths(path)\nfile.listFiles(path)\nfile.listFolders(path)\nfile.copy(fromPath, toPath)\nfile.move(fromPath, toPath)\nfile.name(path)\nfile.extension(path)\nfile.parent(path)\nfile.size(path)\nfile.mime(path)\nfile.modified(path)\nfile.isFile(path)\nfile.isFolder(path)")
  ui.text("Every app has a private folder at /apps/<app-id>. Relative paths such as file.write(\"save.json\", data) resolve there and need no permission. Absolute paths such as /documents/report.txt, /studio/project.mscript, or another app folder require Access to all files for user apps. permission.ask(\"allFiles\") can be used with a fallback. Built-in apps and the Superuser holder can access all paths. Folder parents are created automatically. list functions return | separated names or paths. delete removes folder contents recursively but cannot remove core folders. fileChange fires after successful write, append, delete, mkdir, copy, or move operations.", "small")

  ui.section("14 · Settings API")
  ui.code("settings.get(key, fallback)\nsettings.has(key)\nsettings.set(key, value)\nsettings.toggle(key)\nsettings.keys()\nsettings.reset()")
  ui.text("get, has, and keys are readable by apps. set, toggle, and reset require Modify system settings for user apps. Changes are immediately persisted and applied. settingsChange fires in the calling runtime when set, toggle, or reset succeeds.", "small")

  ui.section("15 · App API")
  ui.code("app.open(id)\napp.home()\napp.close(id)\napp.install(source)\napp.remove(id)\napp.restoreSystem(id)\napp.source(id)\napp.preview(source)\napp.exists(id)\napp.list()\napp.name(id)\napp.version(id)\napp.current()\napp.isSystem(id)\napp.isHidden(id)\napp.setHidden(id, hidden)\napp.disabledSystems()")
  ui.text("open launches an app, home shows Home, and close removes a recent runtime. install and remove require Install apps for normal user apps. app.install validates the entire source before writing anything to storage: empty source, missing app/meta id declarations, malformed syntax, invalid ids, duplicate handlers/functions/parameters, unknown function calls, and invalid loop control are rejected. A failed install returns false and MellorsOS posts an MScript Installer notification with the error and line number when available. source returns MScript source for an active app. preview runs source without installing. list returns | separated ids. current returns this app id. setHidden needs system/Superuser authority for user apps. restoreSystem and system-app removal/replacement are restricted to the actual current Superuser holder, not merely a trusted Settings app.", "small")

  ui.section("16 · Notification API")
  ui.code("notify.send(title, body)\nnotify.clear()\nnotify.count()\nnotify.latestTitle()\nnotify.latestBody()\nnotify.remove(id)")

  ui.section("17 · Permission API")

  ui.text("ask requests one of the seven permissions. has checks effective access, including inherited Superuser access. set requires Modify permissions and can change ordinary permissions but always refuses Superuser. disableSuperuser only works when called by the current holder itself. name returns a friendly label. list returns permission ids. holder returns the holder app id or empty text. isSuperuser tests actual ownership.", "small")

  ui.section("18 · Foreground timers")
  ui.code("timer.after(name, milliseconds, eventName)\ntimer.every(name, milliseconds, eventName)\ntimer.stop(name)\ntimer.isRunning(name)\ntimer.list()")

  ui.section("19 · Background API")
  ui.code("background.start(name, milliseconds, eventName)\nbackground.stop(name)\nbackground.isRunning(name)\nbackground.list()")
  ui.text("start requires Run background processes and runs at a minimum interval enforced by the kernel. stop terminates one named process. isRunning checks one process. list returns the current app's background process names. Revoking Background stops that app's processes.", "small")

  ui.section("20 · Native dialog API")
  ui.code("dialog.alert(title, message, detail)\ndialog.confirm(title, message, detail)\ndialog.danger(title, message, detail)\ndialog.choose(title, message, yesLabel, noLabel, detail)")

  ui.section("21 · Custom events")
  ui.code("events.emit(name, value)")

  ui.code("system.toast(message)\nsystem.log(message)\nsystem.reset()\nsystem.reboot()\nsystem.setAppHidden(id, hidden)\nsystem.info(key)\nsystem.time()\nsystem.date()\nsystem.now()\nsystem.uptime()\nsystem.execute(expression)\nsystem.random(min, max)\nsystem.storageBytes()\nsystem.screenWidth()\nsystem.screenHeight()\nsystem.vibrate(milliseconds)\nsystem.clipboard(text)")
  ui.text("toast shows a temporary OS message and log writes to System Monitor. reset starts the native factory-reset flow; reboot reloads MellorsOS; both require effective Superuser authority. setAppHidden is a privileged visibility control. info keys include name, version, engine, platform, language, online, apps, systemApps, userApps, storageKeys, files, userAgent, and superuser. time/date return formatted local values, now returns epoch milliseconds, uptime returns emulator seconds, execute evaluates one MScript expression directly for system/Superuser runtimes, system.random returns an inclusive random integer, storageBytes estimates MellorsOS storage, screenWidth/screenHeight report emulator dimensions, vibrate uses device vibration when available, and clipboard copies text when the browser permits it.", "small")

  ui.section("23 · Math API")
  ui.code("math.eval(expression)\nmath.round(value, decimals)\nmath.abs(value)\nmath.floor(value)\nmath.ceil(value)\nmath.min(a, b)\nmath.max(a, b)\nmath.clamp(value, min, max)\nmath.random(min, max)\nmath.sqrt(value)\nmath.pow(value, power)")

SYSTEM_SOURCES.studio = String.raw`app "App Studio"
meta id "studio"
meta icon "🛠️"
meta color "#9b62e8"
meta version "1.0 Release"

function normalizeName(name)
  if name == ""
    return "Untitled.mscript"
  end
  if text.endsWith(name, ".mscript")
    return name
  end
  return name + ".mscript"
end

function saveStudioFile()
  let name = normalizeName(ui.value("fileName"))
  let path = "/studio/" + name
  let source = ui.value("source")
  file.write(path, source, "text/plain")
  data.set("draft", source)
  data.set("currentPath", path)
  ui.setValue("fileName", name)
  return path
end

on start
  let requestedPath = data.globalGet("studio.openPath", "")
  if requestedPath != ""
    data.set("currentPath", requestedPath)
    data.set("draft", file.read(requestedPath, ""))
    data.globalDelete("studio.openPath")
  end
  let currentPath = data.get("currentPath", "/studio/Untitled.mscript")
  let source = data.get("draft", data.globalGet("starter.source", ""))
  if file.exists(currentPath)
    set source = file.read(currentPath, source)
  end
  ui.header("App Studio", "MScript projects are stored in /studio")
  ui.rich("MScript workspace", "Save projects as .mscript files, reopen them from Files, preview them, or install them to Home.", "</>")
  ui.fileInput("importApp", "Import & install .mscript", ".mscript,text/plain")
  ui.input("fileName", "Studio file name", file.name(currentPath))
  ui.codeEditor("source", source)
  ui.button("preview", "Preview", "primary")
  ui.button("install", "Save and install", "secondary")
  ui.button("save", "Save to /studio", "secondary")
  ui.button("files", "Open Files", "ghost")
  ui.button("guide", "Open language guide", "ghost")
end

on file importApp
  let name = normalizeName(event.fileName)
  let path = "/studio/" + name
  file.write(path, event.value, event.fileType)
  ui.setValue("fileName", name)
  ui.setValue("source", event.value)
  data.set("currentPath", path)
  data.set("draft", event.value)
  app.install(event.value)
end

on click preview
  saveStudioFile()
  app.preview(ui.value("source"))
end
on click install
  saveStudioFile()
  app.install(ui.value("source"))
end
on click save
  let path = saveStudioFile()
  notify.send("App Studio", "Saved " + path)
end
on click files
  app.open("files")
end
on click guide
  app.open("guide")
end`;

SYSTEM_SOURCES.calculator = String.raw`app "Calculator"
meta id "calculator"
meta icon "🧮"
meta color "#ff785e"
meta version "1.0 Release"

on start
  set expr = ""
  ui.header("Calculator", "Built with MScript event handling")
  ui.calculator()
end

on key
  if event.value == "C"
    set expr = ""
  else
    if event.value == "⌫"
      set expr = ""
    else
      if event.value == "="
        if expr != ""
          set expr = math.eval(expr)
        end
      else
        set expr = expr + event.value
      end
    end
  end
  if expr == ""
    ui.calcSet("0")
  else
    ui.calcSet(expr)
  end
end`;

const systemApps=[];
for(const src of Object.values(SYSTEM_SOURCES)){try{const a=parseMScript(src);a.system=true;systemApps.push(a);}catch(e){console.error('Built-in parse error',e,src);}}
store.rawSet('starter.source',STARTER);
function getInstalled(){const srcs=store.rawGet('installedApps',[])||[];return srcs.map(src=>{try{const a=parseMScript(src);a.system=false;return a;}catch{return null;}}).filter(Boolean);}
function sanitizeInstalledApps(){
  const srcs=store.rawGet('installedApps',[])||[];const valid=[];const validIds=new Set();let removed=0;
  for(const src of srcs){try{const app=validateMScriptForInstall(String(src));valid.push(String(src));validIds.add(String(app.meta.id));}catch{removed++;}}
  if(removed){
    store.rawSet('installedApps',valid);
    const all=permissionRecords();let permissionsChanged=false;
    for(const id of Object.keys(all)){
      if(all[id]?.superuser===true)continue;
      if(!validIds.has(id)){delete all[id];permissionsChanged=true;}
    }
    if(permissionsChanged)store.rawSet('permissions',all);
    notify('MScript Installer',`Removed ${removed} invalid legacy app${removed===1?'':'s'} that could not pass installation validation.`,'system');
    log(`Removed ${removed} invalid legacy installed app record(s)`);
  }
  return removed;
}
function getDisabledSystemApps(){return (store.rawGet('disabledSystemApps',[])||[]).map(String);}
function setSystemDisabled(id,disabled){id=String(id);let list=getDisabledSystemApps().filter(x=>x!==id);if(disabled)list.push(id);store.rawSet('disabledSystemApps',[...new Set(list)]);return true;}
function getActiveSystemApps(){const disabled=getDisabledSystemApps();return systemApps.filter(a=>!disabled.includes(a.meta.id));}
function getAllApps(){const installed=getInstalled();const installedIds=new Set(installed.map(a=>a.meta.id));return [...getActiveSystemApps().filter(a=>!installedIds.has(a.meta.id)),...installed];}
function getApp(id){id=String(id);return getAllApps().find(a=>a.meta.id===id);}
function getHiddenApps(){return store.rawGet('hiddenApps',[])||[];}
function setAppHidden(id,hidden){id=String(id);let list=getHiddenApps().filter(x=>x!==id);if(hidden)list.push(id);store.rawSet('hiddenApps',list);return true;}
function installFailure(message,line=0){const detail=`${String(message)}${line?` (line ${line})`:''}`;log(`MScript install rejected: ${detail}`);notify('MScript Installer',`Installation failed: ${detail}`,'system');toast('App not installed — see Notifications');return false;}
function installMScript(source,requesterId=''){try{const app=validateMScriptForInstall(source);const requester=String(requesterId);const holder=superuserHolder();const builtIn=systemApps.find(a=>a.meta.id===app.meta.id);if(builtIn&&holder!==requester)return installFailure('That app id belongs to a built-in system app');if(holder===app.meta.id&&requester!==app.meta.id)return installFailure('The Superuser app is protected from replacement');if(builtIn&&holder===requester)setSystemDisabled(app.meta.id,true);let srcs=store.rawGet('installedApps',[])||[];srcs=srcs.filter(s=>{try{return parseMScript(s).meta.id!==app.meta.id;}catch{return false;}});srcs.push(String(source));store.rawSet('installedApps',srcs);const all=permissionRecords();if(!Object.prototype.hasOwnProperty.call(all,app.meta.id)){all[app.meta.id]={};store.rawSet('permissions',all);}notify('App installed',app.meta.name,app.meta.id);showHome();return true;}catch(e){return installFailure(e?.message||'Unknown MScript installation error',e?.line||0);}}
function uninstallApp(id,requesterId=''){id=String(id);const requester=String(requesterId),holder=superuserHolder(),app=getApp(id);if(!app){toast('App not found');return false;}if(holder===id){toast('Superuser app is protected. It must disable Superuser itself first.');return false;}if(app.system){if(holder!==requester){toast('Only the current Superuser app can remove a built-in system app');return false;}setSystemDisabled(id,true);for(const key of store.keys(`app.${id}.`))store.rawDelete(key);fsEraseAppFolder(id);setAppHidden(id,false);stopAppBackground(id);closeRecent(id);toast('System app removed by Superuser');return true;}let srcs=store.rawGet('installedApps',[])||[];srcs=srcs.filter(s=>{try{return parseMScript(s).meta.id!==id;}catch{return false;}});store.rawSet('installedApps',srcs);for(const key of store.keys(`app.${id}.`))store.rawDelete(key);fsEraseAppFolder(id);const all=permissionRecords();delete all[id];store.rawSet('permissions',all);setAppHidden(id,false);stopAppBackground(id);closeRecent(id);toast('App uninstalled and its data erased');return true;}
function restoreSystemApp(id){id=String(id);if(!systemApps.some(a=>a.meta.id===id))return false;let srcs=store.rawGet('installedApps',[])||[];srcs=srcs.filter(s=>{try{return parseMScript(s).meta.id!==id;}catch{return false;}});store.rawSet('installedApps',srcs);setSystemDisabled(id,false);setAppHidden(id,false);toast('Built-in system app restored');return true;}
function previewMScript(source){try{const app=parseMScript(source);app.meta.id='preview_'+Date.now();openParsedApp(app,true);return true;}catch(e){showRuntimeError({meta:{name:'Preview',id:'preview',icon:'!',color:'#b03b55'},source},e);return false;}}

/* -------------------------- Window manager -------------------------- */
function renderHome(){
  const hidden=getHiddenApps();const apps=getAllApps().filter(a=>!hidden.includes(a.meta.id)).sort((a,b)=>a.meta.name.localeCompare(b.meta.name));
  root.innerHTML=`<section class="screen" id="home"><div class="home-header"><div><div class="home-title">${escapeHTML(settings.homeTitle)}</div><div class="home-sub">${escapeHTML(settings.homeSubtitle)}</div></div><div class="avatar">${escapeHTML((settings.username||'O')[0].toUpperCase())}</div></div><div id="appGrid">${apps.map(a=>`<button class="app-icon-wrap" data-launch="${a.meta.id}"><span class="app-icon" style="background:linear-gradient(145deg,${a.meta.color},color-mix(in srgb,${a.meta.color} 55%,#111))">${escapeHTML(a.meta.icon)}</span><span class="app-label">${escapeHTML(a.meta.name)}</span></button>`).join('')}</div></section>`;
  document.querySelectorAll('[data-launch]').forEach(el=>el.onclick=()=>openApp(el.dataset.launch)); state.current=null;
}
function pauseCurrent(reason='navigate'){const rt=state.appInstances.get(state.current);if(rt){rt.trigger('pause',{type:'pause',reason});for(const h of rt.foregroundTimers.values()){if(h.kind==='interval')clearInterval(h.id);else clearTimeout(h.id);}rt.foregroundTimers.clear();}}
function showHome(){ if(state.current) state.history.push(state.current); pauseCurrent('home'); renderHome(); }
function openParsedApp(app,preview=false){
  const existing=state.appInstances.get(app.meta.id);if(existing)existing.destroy('relaunch');
  const rt=new MRuntime(app);state.appInstances.set(app.meta.id,rt);state.current=app.meta.id;
  if(!preview){state.recents=state.recents.filter(id=>id!==app.meta.id);state.recents.unshift(app.meta.id);state.recents=state.recents.slice(0,12);}
  log(`Opened ${app.meta.name}`);rt.mount();
}
function openApp(id){id=String(id);const app=getApp(id);if(!app){toast('App not found');return;}if(state.current&&state.current!==id){state.history.push(state.current);pauseCurrent('app-open');}openParsedApp(app);}
function closeRecent(id){state.recents=state.recents.filter(x=>x!==id);const rt=state.appInstances.get(id);if(rt){rt.destroy('recent-close');state.appInstances.delete(id);}if(state.current===id)showHome();}
function showRecents(){
  if(state.current)state.history.push(state.current);pauseCurrent('recents');
  const apps=state.recents.map(getApp).filter(Boolean);
  root.innerHTML=`<section class="screen" id="recents"><div class="app-header"><div class="app-header-icon" style="background:#4e5875">▢</div><div><div class="app-header-title">Recent Apps</div><div class="app-header-sub">Tap a card to reopen · close apps with ×</div></div></div>${apps.length?apps.map(a=>`<div class="recent-card" data-open-recent="${a.meta.id}"><div class="recent-top"><span>${escapeHTML(a.meta.icon)} ${escapeHTML(a.meta.name)}</span><button class="close-x" data-close-recent="${a.meta.id}" aria-label="Close">×</button></div><div class="recent-preview">${escapeHTML(a.meta.icon)}</div></div>`).join(''):'<div class="card center"><div style="font-size:2rem">▢</div><div class="row-title">No recent apps</div></div>'}</section>`;
  document.querySelectorAll('[data-open-recent]').forEach(el=>el.onclick=e=>{if(!e.target.closest('[data-close-recent]'))openApp(el.dataset.openRecent)});
  document.querySelectorAll('[data-close-recent]').forEach(el=>el.onclick=e=>{e.stopPropagation();closeRecent(el.dataset.closeRecent);showRecents();});state.current='__recents';
}
$('#navHome').onclick=()=>{vibrate();const rt=state.appInstances.get(state.current);if(rt?.trigger('homeButton',{type:'homeButton'})===true)return;showHome();};
$('#navRecents').onclick=()=>{vibrate();const rt=state.appInstances.get(state.current);if(rt?.trigger('recentsButton',{type:'recentsButton'})===true)return;showRecents();};
$('#navBack').onclick=()=>{vibrate();if($('#notificationShade').classList.contains('shade-open')){$('#notificationShade').classList.remove('shade-open');return;}const rt=state.appInstances.get(state.current);if(rt?.trigger('back',{type:'back'})===true)return;const prev=state.history.pop();if(prev&&prev!=='__recents'&&getApp(prev))openApp(prev);else showHome();};

let fpsEl=null,lastFrame=performance.now(),frames=0;
function fpsLoop(t){frames++;if(t-lastFrame>=1000){if(settings.showFPS){if(!fpsEl){fpsEl=document.createElement('div');fpsEl.style='position:absolute;top:38px;right:8px;z-index:90;background:#000a;padding:4px 7px;border-radius:8px;font:11px monospace';device.appendChild(fpsEl);}fpsEl.textContent=frames+' FPS';}else if(fpsEl){fpsEl.remove();fpsEl=null;}frames=0;lastFrame=t;}requestAnimationFrame(fpsLoop);}requestAnimationFrame(fpsLoop);

window.addEventListener('error',e=>log(`Kernel error: ${e.message}`));
log('MellorsOS kernel booted');
sanitizeInstalledApps();
renderHome();
})();
</script>
