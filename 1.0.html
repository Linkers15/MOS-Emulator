eight:90px;color:#d5dcff}

<body>
<div id="device">
  <div id="wallpaper"></div>
  <div id="statusbar"><span id="clockMini">9:41</span><span id="statusIcons"><span id="devDot" class="hidden">● DEV</span><span>◉</span><span>⌁</span><span id="battery">100%</span></span></div>
  <main id="appRoot"></main>
  <nav id="nav"><button class="navbtn" id="navBack" aria-label="Back">‹</button><button class="navbtn" id="navHome" aria-label="Home">●</button><button class="navbtn" id="navRecents" aria-label="Recent apps">▢</button></nav>
  <div id="toast"></div>
  <section id="notificationShade"><div class="shade-handle"></div><div class="row"><div><div class="big-number" id="shadeTime">9:41</div><div class="small" id="shadeDate"></div></div><button class="secondary" id="clearNotifications">Clear</button></div><div id="shadeNotifications"></div></section>
  <div id="osModalHost" role="dialog" aria-modal="true" aria-live="assertive"></div>
</div>
<script>
(() => {
"use strict";

/* ================================================================
   MellorsOS Kernel
   UI shell + MScript runtime. Every built-in app below is MScript.
   ================================================================ */
const $ = s => document.querySelector(s);
const root = $('#appRoot');
const device = $('#device');
const STORAGE_PREFIX = 'mellorsos.';
const state = {
  current:null, history:[], recents:[], notifications:[], appInstances:new Map(),
  background:new Map(), eventBus:new Map(), pendingFileOpens:new Map(), fileGrants:new Map(), logs:[], developer:false
};
const defaults = {
  accent:'#6d7cff', accent2:'#a96cff', wallpaper:'aurora', gridCols:4, iconSize:58, iconShape:'squircle',
  showAppLabels:true, homeTitle:'MellorsOS', homeSubtitle:'Programmable by design', username:'Owner',
  fontScale:1, compact:false, highContrast:false, reduceMotion:false, reduceTransparency:false, largeTargets:false, boldText:false,
  haptics:true, showSeconds:false, clock24h:false, showBattery:true, showStatusIcons:true, navCompact:false,
  notificationToasts:true, notificationPreview:true, notificationLimit:50, developerMode:false, showFPS:false
};
const memoryStorage = new Map();
function storageKeys(){ try{return Object.keys(localStorage);}catch{return [...memoryStorage.keys()];} }
const store = {
  rawGet(k, fallback=null){
    const key=STORAGE_PREFIX+k;
    try{const v=localStorage.getItem(key);if(v!==null)return JSON.parse(v);}catch{}
    try{return memoryStorage.has(key)?JSON.parse(memoryStorage.get(key)):fallback;}catch{return fallback;}
  },
  rawSet(k,v){const key=STORAGE_PREFIX+k, encoded=JSON.stringify(v);try{localStorage.setItem(key,encoded);}catch{memoryStorage.set(key,encoded);}return v;},
  rawDelete(k){const key=STORAGE_PREFIX+k;try{localStorage.removeItem(key);}catch{}memoryStorage.delete(key);},
  keys(prefix=''){return storageKeys().filter(k=>k.startsWith(STORAGE_PREFIX+prefix)).map(k=>k.slice(STORAGE_PREFIX.length));},
  clearAll(){storageKeys().filter(k=>k.startsWith(STORAGE_PREFIX)).forEach(k=>{try{localStorage.removeItem(k);}catch{}memoryStorage.delete(k);});}
};

/* ---------------------- MellorsOS virtual filesystem ---------------------- */
const FILESYSTEM_KEY='filesystem';
const FILESYSTEM_VERSION=1;
const FILESYSTEM_CORE_FOLDERS=['/','/apps','/imports','/studio','/documents'];
function fsNormalize(path){
  let raw=String(path??'').replace(/\\/g,'/').trim();
  if(!raw)raw='/';
  if(!raw.startsWith('/'))raw='/'+raw;
  const parts=[];
  for(const part of raw.split('/')){
    if(!part||part==='.')continue;
    if(part==='..'){parts.pop();continue;}
    parts.push(part.replace(/[\u0000-\u001f\u007f]/g,''));
  }
  const out='/'+parts.filter(Boolean).join('/');
  if(out.length>768)throw new MScriptError('File path is too long');
  return out||'/';
}
function fsParent(path){const p=fsNormalize(path);if(p==='/')return'/';const i=p.lastIndexOf('/');return i<=0?'/':p.slice(0,i);}
function fsName(path){const p=fsNormalize(path);return p==='/'?'/':p.slice(p.lastIndexOf('/')+1);}
function fsExtension(path){const n=fsName(path);const i=n.lastIndexOf('.');return i<=0?'':n.slice(i+1).toLowerCase();}
function fsAppRoot(appId){return fsNormalize('/apps/'+String(appId));}
function fsNew(){const now=Date.now(),entries={};for(const p of FILESYSTEM_CORE_FOLDERS)entries[p]={kind:'folder',owner:'system',created:now,modified:now};return{version:FILESYSTEM_VERSION,entries};}
function fsLoad(){
  let fs=store.rawGet(FILESYSTEM_KEY,null);
  if(!fs||typeof fs!=='object'||!fs.entries||typeof fs.entries!=='object')fs=fsNew();
  let changed=false,now=Date.now();
  for(const p of FILESYSTEM_CORE_FOLDERS)if(!fs.entries[p]||fs.entries[p].kind!=='folder'){fs.entries[p]={kind:'folder',owner:'system',created:now,modified:now};changed=true;}
  fs.version=FILESYSTEM_VERSION;
  if(changed)store.rawSet(FILESYSTEM_KEY,fs);
  return fs;
}
function fsSave(fs){store.rawSet(FILESYSTEM_KEY,fs);return fs;}
function fsEnsureFolderIn(fs,path,owner='system'){
  path=fsNormalize(path);let current='';const now=Date.now();
  if(path==='/'){if(!fs.entries['/'])fs.entries['/']={kind:'folder',owner,created:now,modified:now};return'/';}
  for(const part of path.slice(1).split('/')){
    current+='/'+part;
    const entry=fs.entries[current];
    if(entry&&entry.kind!=='folder')throw new MScriptError(`A file already exists at ${current}`);
    if(!entry)fs.entries[current]={kind:'folder',owner,created:now,modified:now};
  }

function showRuntimeError(app,e){log(`Error in ${app.meta.name}: ${e.message} line ${e.line||'?'}`);root.innerHTML=`<section class="screen"><div class="app-page"><div class="app-header"><div class="app-header-icon" style="background:#b03b55">!</div><div><div class="app-header-title">MScript Error</div><div class="app-header-sub">${escapeHTML(app.meta.name)}</div></div></div><div class="card"><div class="row-title">${escapeHTML(e.message)}</div><div class="row-sub">Line ${e.line||'unknown'}</div></div><pre class="code">${escapeHTML(app.source.split('\n').map((l,i)=>`${String(i+1).padStart(3)}  ${l}`).join('\n'))}</pre></div></section>`;}
function crashForPermission(rt,e){const app=rt.app;log(`${app.meta.name} crashed: ungranted permission ${e.permission}`);rt.destroy();stopAppBackground(app.meta.id);state.appInstances.delete(app.meta.id);state.recents=state.recents.filter(id=>id!==app.meta.id);notify('MScript',`${app.meta.name} crashed due to an ungranted permission: ${permissionLabel(e.permission)}.`, 'system');if(state.current===app.meta.id)renderHome();}
function backgroundStart(rt,name,ms,eventName){const key=`${rt.app.meta.id}:${name}`;backgroundStop(rt.app.meta.id,name);const id=setInterval(()=>{if(!hasPermission(rt.app,'background')){crashForPermission(rt,new PermissionDeniedError('background'));return;}rt.trigger(eventName,{type:'background',name,time:Date.now()});},Math.max(250,ms));state.background.set(key,id);rt.timerNames.add(name);log(`Background process started: ${key} every ${ms}ms`);}
function backgroundStop(appId,name){const key=`${appId}:${name}`,id=state.background.get(key);if(id){clearInterval(id);state.background.delete(key);log(`Background process stopped: ${key}`);}}

meta id "files"
meta icon "📁"

function renderBrowser()
  set mode = "browser"
  set viewing = ""
  ui.clear()
  ui.header("Files", currentPath)

    ui.section("Contents")

function renderRename(path)
  set mode = "rename"
  set targetPath = path
  ui.clear()
  ui.header("Rename", path)
  ui.button("operationBack", "← Cancel", "ghost")
  ui.input("newName", "New name", file.name(path))
  ui.button("confirmRename", "Rename", "primary")
end

function renderTransfer(path, operation)
  set mode = operation
  set targetPath = path
  ui.clear()
  if operation == "copy"
    ui.header("Copy", path)
  else
    ui.header("Move", path)
  end
  ui.button("operationBack", "← Cancel", "ghost")
  if operation == "copy"
    ui.input("destination", "Destination path", currentPath + "/Copy of " + file.name(path))
  else
    ui.input("destination", "Destination path", "/documents/" + file.name(path))
  end
  if operation == "copy"
    ui.button("confirmCopy", "Copy here", "primary")
  else
    ui.button("confirmMove", "Move here", "primary")
  end

function renderExtension(path)
  set mode = "extension"
  set targetPath = path
  ui.clear()
  ui.header("Change extension", path)
  ui.button("operationBack", "← Cancel", "ghost")
  ui.input("newExtension", "New extension", file.extension(path))
  ui.text("Enter an extension with or without a leading dot. Leave it blank to remove the extension.", "small")
  ui.button("confirmExtension", "Change extension", "primary")
end

function renderOpenWith(path)
  set mode = "openWith"
  set targetPath = path
  ui.clear()
  ui.header("Open with", file.name(path))
  ui.button("operationBack", "← Cancel", "ghost")
  ui.openWithList(path)

on start
  let currentPath = data.get("currentPath", "/")
  let viewing = ""
  let targetPath = ""
  let mode = "browser"
  renderBrowser()
end

on openFile
  set currentPath = file.parent(event.path)
  data.set("currentPath", currentPath)
  renderViewer(event.path)
end

on back
  if mode != "browser"
    renderBrowser()
    return true
  end
  if currentPath != "/"
    set currentPath = file.parent(currentPath)
    data.set("currentPath", currentPath)
    renderBrowser()
    return true
  end
  return false
end

on click operationBack
  renderBrowser()
end

on click newFolder
  let name = ui.value("folderName")
  if name == ""
    system.toast("Enter a folder name")
  else
    file.mkdir(currentPath + "/" + name)
    renderBrowser()
  end
end

on click confirmRename
  let name = ui.value("newName")
  if name == ""
    system.toast("Enter a new name")
  else
    let result = file.rename(targetPath, name)
    set currentPath = file.parent(result)
    data.set("currentPath", currentPath)
    renderBrowser()
  end
end

on click confirmCopy
  let destination = ui.value("destination")
  file.copy(targetPath, destination)
  set currentPath = file.parent(destination)
  data.set("currentPath", currentPath)
  renderBrowser()
end

on click confirmMove
  let destination = ui.value("destination")
  file.move(targetPath, destination)
  set currentPath = file.parent(destination)
  data.set("currentPath", currentPath)
  renderBrowser()
end

on click confirmExtension
  let result = file.changeExtension(targetPath, ui.value("newExtension"))
  set currentPath = file.parent(result)
  data.set("currentPath", currentPath)
  renderBrowser()
end

on file importFile
  set currentPath = "/imports"
  data.set("currentPath", currentPath)
  system.toast("Imported to " + event.filePath)
  renderBrowser()
end

on fileNavigate
  set currentPath = event.path
  data.set("currentPath", currentPath)
  renderBrowser()
end

on openWith
  app.openFile(event.appId, event.path)
end

on fileAction
  if event.action == "browse"
    set currentPath = event.path
    data.set("currentPath", currentPath)
    renderBrowser()
  else
    if event.action == "edit"
      app.openFile("studio", event.path)
    else
      if event.action == "install"
        app.install(file.read(event.path, ""))
      else
        if event.action == "delete"
          if dialog.danger("Delete permanently?", "Delete " + event.name + " and all of its contents?", event.path)
            file.delete(event.path)
            renderBrowser()
          end
        else
          if event.action == "open"
            renderViewer(event.path)
          else
            if event.action == "rename"
              renderRename(event.path)
            else
              if event.action == "copy"
                renderTransfer(event.path, "copy")
              else
                if event.action == "move"
                  renderTransfer(event.path, "move")
                else
                  if event.action == "extension"
                    renderExtension(event.path)
                  else
                    if event.action == "export"
                      file.export(event.path, event.name)
                      system.toast("Export started")
                    else
                      if event.action == "openWith"
                        renderOpenWith(event.path)
                      end
                    end
                  end
                end
              end
            end
          end
        end
      end
    end
  end
end`;
SYSTEM_SOURCES.notes = String.raw`app "Notes"
meta id "notes"
meta icon "📝"
meta color "#f0a33b"
meta version "1.0 Release"
meta accepts "txt|md|csv|json|text/*|application/json"

on start
  let editingPath = data.get("editingPath", "")
  ui.header("Notes", "Local notes and text-file editing")
  if editingPath != "" && file.exists(editingPath)
    ui.infoRow("File", editingPath)
    ui.input("name", "File name", file.name(editingPath))
    ui.textarea("body", "Contents", file.read(editingPath, ""), "Write anything...")
  else
    set editingPath = ""
    data.set("editingPath", "")
    ui.input("name", "Note name", data.get("lastName", "New Note"))
    ui.textarea("body", "Contents", data.globalGet("notes.file." + data.get("lastName", "New Note"), ""), "Write anything...")
  end
  ui.button("save", "Save", "primary")
  ui.button("new", "New note", "secondary")
  ui.button("delete", "Delete", "danger")
  ui.section("Saved notes")
  ui.noteList("notes.file.")
end

on openFile
  data.set("editingPath", event.path)
  app.open("notes")
end

on click save
  let name = ui.value("name")
  let body = ui.value("body")
  let editingPath = data.get("editingPath", "")
  if name == ""
    system.toast("Enter a name")
  else
    if editingPath != ""
      if file.name(editingPath) != name
        set editingPath = file.rename(editingPath, name)
        data.set("editingPath", editingPath)
      end
      file.write(editingPath, body, file.mime(editingPath))
      notify.send("Notes", "Saved " + editingPath)
    else
      data.globalSet("notes.file." + name, body)
      data.set("lastName", name)
      notify.send("Notes", "Saved " + name)
    end
    app.open("notes")
  end
end

on click new
  data.set("editingPath", "")
  data.set("lastName", "Untitled")
  app.open("notes")
end

on click delete
  let editingPath = data.get("editingPath", "")
  if editingPath != ""
    if dialog.danger("Delete file?", "Permanently delete " + editingPath + "?")
      file.delete(editingPath)
      data.set("editingPath", "")
      app.open("notes")
    end
  else
    let name = ui.value("name")
    data.globalDelete("notes.file." + name)
    data.set("lastName", "New Note")
    system.toast("Deleted " + name)
    app.open("notes")
  end
end

on openNote
  data.set("editingPath", "")
  data.set("lastName", event.value)
  app.open("notes")
end`;

SYSTEM_SOURCES.guide = String.raw`app "MScript Guide"
meta id "guide"
meta icon "📘"
meta color "#4474d9"
meta version "1.0 Release"

on start
  ui.header("MScript Guide", "Offline language and complete API reference")
  ui.alert("Fully offline", "MScript cannot execute HTML, JavaScript, webpages, remote scripts, or network requests. Apps use native MellorsOS controls, storage, files, games, and sound.", "success")

  ui.section("Language syntax")
  ui.code("app \"My App\"\nmeta id \"my.app\"\nmeta icon \"◆\"\nmeta color \"#6d7cff\"\nmeta version \"1.0\"\nmeta accepts \"txt|md|image/*\"\n\non start\n  let score = 0\n  ui.button(\"play\", \"Play\")\nend\n\non click play\n  set score = score + 1\nend")
  ui.text("Literal text requires quotes. Numbers, true, false, null, variables, and function results are unquoted. Control IDs may be quoted or written as bare identifiers. Multiline API calls are supported while parentheses remain open.", "small")

  ui.section("Control flow")
  ui.code("if condition\n  ...\nelse\n  ...\nend\n\nwhile condition\n  ...\nend\n\nrepeat 10\n  system.log(index)\nend\n\nfor n from 1 to 10\n  if n == 5\n    continue\n  end\n  if n == 8\n    break\n  end\nend")
  ui.text("Use let to create/set a variable and set to update it. Functions use function name(parameters) ... end and may return a value.", "small")

  ui.section("Events")
  ui.code("on start\non resume\non pause\non close\non back\non homeButton\non recentsButton\non click controlId\non input controlId\non change controlId\non file controlId\non openFile\non fileChange\non gameFrame\non gameKeyDown\non gameKeyUp\non gamePointerDown\non gamePointerMove\non gamePointerUp\non gameControlDown\non gameControlUp\non gameImageLoaded\non gameImageError\non soundEnded\non soundError")
  ui.text("Event details are read through event.*, such as event.value, event.path, event.key, event.x, event.y, event.delta, event.appId, and event.fileName.", "small")

  ui.section("Permissions")
  ui.code("permission.ask(\"settings\")\npermission.ask(\"notifications\")\npermission.ask(\"installApps\")\npermission.ask(\"modifyPermissions\")\npermission.ask(\"allFiles\")\npermission.ask(\"background\")\npermission.ask(\"superuser\")")
  ui.text("System apps have every permission. User apps begin with none. Calling a protected function without permission crashes the app. permission.ask returns true or false so an app can provide a fallback.", "small")

  ui.section("Filesystem and file-opening apps")
  ui.code("file.write(\"save.txt\", \"hello\")\nfile.rename(\"save.txt\", \"player.txt\")\nfile.changeExtension(\"player.txt\", \"json\")\nfile.copy(\"player.json\", \"backup.json\")\nfile.move(\"backup.json\", \"/documents/backup.json\")\nfile.export(\"/documents/backup.json\")\n\nmeta accepts \"txt|md|image/*\"\non openFile\n  system.log(event.path)\nend")
  ui.text("Relative paths stay in /apps/<app-id>. Shared absolute paths require Access to all files. Apps declare supported extensions or MIME patterns with meta accepts. Files can then use app.openFile to deliver an on openFile event.", "small")

  ui.section("Native game example")
  ui.code("app \"Ball Game\"\nmeta id \"ball.game\"\nmeta icon \"🎮\"\n\non start\n  let score = 0\n  game.create(360, 520, \"#08111f\")\n  game.entity(\"player\", 160, 420, 36, 36, \"#6d7cff\")\n  game.circleEntity(\"coin\", 170, 80, 24, \"#ffd24a\")\n  game.dpad(18, 390, 42, 5)\n  game.start(60, \"gameFrame\")\nend\n\non gameFrame\n  let speed = 180 * event.delta\n  if game.keyDown(\"ArrowLeft\") || game.controlDown(\"left\")\n    game.move(\"player\", 0 - speed, 0)\n  end\n  if game.keyDown(\"ArrowRight\") || game.controlDown(\"right\")\n    game.move(\"player\", speed, 0)\n  end\n  game.keepInside(\"player\", false)\n  if game.collides(\"player\", \"coin\")\n    set score = score + 1\n    game.setPosition(\"coin\", math.random(0, 330), math.random(30, 300))\n    sound.beep(700, 80, 0.2, \"square\")\n  end\n  game.draw(true)\n  game.text(\"Score: \" + score, 12, 12, 18, \"white\")\nend")
  ui.text("The game API uses a native 2D canvas. It supports shapes, local images, entities, velocity, collisions, keyboard, pointer/touch input, on-screen controls, animation frames, and offline sound.", "small")

SYSTEM_SOURCES.studio = String.raw`app "App Studio"
meta id "studio"
meta icon "🛠️"
meta color "#9b62e8"
meta version "1.0 Release"
meta accepts "mscript|text/plain"

function normalizeName(name)
  if name == ""
    return "Untitled.mscript"
  end
  if text.endsWith(name, ".mscript")
    return name
  end
  return name + ".mscript"
end

function saveStudioFile()
  let name = normalizeName(ui.value("fileName"))
  let path = "/studio/" + name
  let source = ui.value("source")
  file.write(path, source, "text/plain")
  data.set("draft", source)
  data.set("currentPath", path)
  ui.setValue("fileName", name)
  return path
end

function installedAppOptions()
  let ids = app.list()
  let options = ""
  let total = text.count(ids, "|")
  for index from 0 to total - 1
    let id = text.part(ids, "|", index)
    if id != ""
      if options != ""
        set options = options + "|"
      end
      set options = options + id + ":" + app.name(id)
    end
  end
  return options
end

on start
  let requestedPath = data.globalGet("studio.openPath", "")
  if requestedPath != ""
    data.set("currentPath", requestedPath)
    data.set("draft", file.read(requestedPath, ""))
    data.globalDelete("studio.openPath")
  end
  let currentPath = data.get("currentPath", "/studio/Untitled.mscript")
  let source = data.get("draft", data.globalGet("starter.source", ""))
  if file.exists(currentPath)
    set source = file.read(currentPath, source)
  end
  ui.header("App Studio", "MScript projects are stored in /studio")
  ui.rich("MScript workspace", "Save projects as .mscript files, reopen them from Files, preview them, or install them to Home.", "</>")
  ui.select("installedApp", "Installed app", "", installedAppOptions())
  ui.button("loadInstalled", "Load installed app source", "secondary")
  ui.fileInput("importApp", "Import & install .mscript", ".mscript,text/plain")
  ui.input("fileName", "Studio file name", file.name(currentPath))
  ui.codeEditor("source", source)
  ui.button("preview", "Preview", "primary")
  ui.button("install", "Save and install", "secondary")
  ui.button("save", "Save to /studio", "secondary")
  ui.button("files", "Open Files", "ghost")
  ui.button("guide", "Open language guide", "ghost")
end

on openFile
  data.globalSet("studio.openPath", event.path)
  app.open("studio")
end

on file importApp
  let name = normalizeName(event.fileName)
  let path = "/studio/" + name
  file.write(path, event.value, event.fileType)
  ui.setValue("fileName", name)
  ui.setValue("source", event.value)
  data.set("currentPath", path)
  data.set("draft", event.value)
  app.install(event.value)
end

on click loadInstalled
  let id = ui.value("installedApp")
  let source = app.source(id)
  if source == ""
    dialog.alert("Source unavailable", "Choose an installed app whose source can be loaded.")
  else
    let name = normalizeName(id)
    let path = "/studio/" + name
    ui.setValue("fileName", name)
    ui.setValue("source", source)
    data.set("currentPath", path)
    data.set("draft", source)
    notify.send("App Studio", "Loaded exact source for " + app.name(id))
  end
end

on click preview
  saveStudioFile()
  app.preview(ui.value("source"))
end
on click install
  saveStudioFile()
  app.install(ui.value("source"))
end
on click save
  let path = saveStudioFile()
  notify.send("App Studio", "Saved " + path)
end
on click files
  app.open("files")
end
on click guide
  app.open("guide")
end`;

const systemApps=[];
for(const src of Object.values(SYSTEM_SOURCES)){
  try{const a=validateMScriptForInstall(src);a.system=true;systemApps.push(a);}
  catch(e){
    console.error('Built-in MScript validation error',e,src);
    const detail=String(e?.message||'Invalid built-in app')+(e?.line?' (line '+e.line+')':'');
    notify('MellorsOS system app error',detail,'system');
  }
}
store.rawSet('starter.source',STARTER);
function getInstalled(){const srcs=store.rawGet('installedApps',[])||[];return srcs.map(src=>{try{const a=parseMScript(src);a.system=false;return a;}catch{return null;}}).filter(Boolean);}
function sanitizeInstalledApps(){
  const srcs=store.rawGet('installedApps',[])||[];const valid=[];const validIds=new Set();let removed=0;
  for(const src of srcs){try{const app=validateMScriptForInstall(String(src));valid.push(String(src));validIds.add(String(app.meta.id));}catch{removed++;}}
  if(removed){
    store.rawSet('installedApps',valid);
    const all=permissionRecords();let permissionsChanged=false;
    for(const id of Object.keys(all)){
      if(!validIds.has(id)){delete all[id];permissionsChanged=true;}
    }
    if(permissionsChanged)store.rawSet('permissions',all);
    notify('MScript Installer',`Removed ${removed} invalid legacy app${removed===1?'':'s'} that could not pass installation validation.`,'system');
    log(`Removed ${removed} invalid legacy installed app record(s)`);
  }
  return removed;
}
function getDisabledSystemApps(){return (store.rawGet('disabledSystemApps',[])||[]).map(String);}
function setSystemDisabled(id,disabled){id=String(id);let list=getDisabledSystemApps().filter(x=>x!==id);if(disabled)list.push(id);store.rawSet('disabledSystemApps',[...new Set(list)]);return true;}
function getActiveSystemApps(){const disabled=getDisabledSystemApps();return systemApps.filter(a=>!disabled.includes(a.meta.id));}
function getAllApps(){const installed=getInstalled();const installedIds=new Set(installed.map(a=>a.meta.id));return [...getActiveSystemApps().filter(a=>!installedIds.has(a.meta.id)),...installed];}
function getApp(id){id=String(id);return getAllApps().find(a=>a.meta.id===id);}
function getHiddenApps(){return store.rawGet('hiddenApps',[])||[];}
function setAppHidden(id,hidden){id=String(id);let list=getHiddenApps().filter(x=>x!==id);if(hidden)list.push(id);store.rawSet('hiddenApps',list);return true;}
function installFailure(message,line=0){const detail=`${String(message)}${line?` (line ${line})`:''}`;log(`MScript install rejected: ${detail}`);notify('MScript Installer',`Installation failed: ${detail}`,'system');toast('App not installed — see Notifications');return false;}
function installMScript(source,requesterId=''){try{const app=validateMScriptForInstall(source);const requester=String(requesterId);const holder=superuserHolder();const builtIn=systemApps.find(a=>a.meta.id===app.meta.id);if(builtIn&&holder!==requester)return installFailure('That app id belongs to a built-in system app');if(holder===app.meta.id&&requester!==app.meta.id)return installFailure('The Superuser app is protected from replacement');if(builtIn&&holder===requester)setSystemDisabled(app.meta.id,true);let srcs=store.rawGet('installedApps',[])||[];srcs=srcs.filter(s=>{try{return parseMScript(s).meta.id!==app.meta.id;}catch{return false;}});srcs.push(String(source));store.rawSet('installedApps',srcs);const all=permissionRecords();if(!Object.prototype.hasOwnProperty.call(all,app.meta.id)){all[app.meta.id]={};store.rawSet('permissions',all);}notify('App installed',app.meta.name,app.meta.id);showHome();return true;}catch(e){return installFailure(e?.message||'Unknown MScript installation error',e?.line||0);}}
function uninstallApp(id,requesterId=''){id=String(id);const requester=String(requesterId),holder=superuserHolder(),app=getApp(id);if(!app){toast('App not found');return false;}if(holder===id){toast('Superuser app is protected. It must disable Superuser itself first.');return false;}if(app.system){if(holder!==requester){toast('Only the current Superuser app can remove a built-in system app');return false;}setSystemDisabled(id,true);for(const key of store.keys(`app.${id}.`))store.rawDelete(key);fsEraseAppFolder(id);setAppHidden(id,false);stopAppBackground(id);state.fileGrants.delete(id);closeRecent(id);toast('System app removed by Superuser');return true;}let srcs=store.rawGet('installedApps',[])||[];srcs=srcs.filter(s=>{try{return parseMScript(s).meta.id!==id;}catch{return false;}});store.rawSet('installedApps',srcs);for(const key of store.keys(`app.${id}.`))store.rawDelete(key);fsEraseAppFolder(id);const all=permissionRecords();delete all[id];store.rawSet('permissions',all);setAppHidden(id,false);stopAppBackground(id);state.fileGrants.delete(id);closeRecent(id);toast('App uninstalled and its data erased');return true;}
function restoreSystemApp(id){id=String(id);if(!systemApps.some(a=>a.meta.id===id))return false;let srcs=store.rawGet('installedApps',[])||[];srcs=srcs.filter(s=>{try{return parseMScript(s).meta.id!==id;}catch{return false;}});store.rawSet('installedApps',srcs);setSystemDisabled(id,false);setAppHidden(id,false);toast('Built-in system app restored');return true;}
function previewMScript(source){try{const app=parseMScript(source);app.meta.id='preview_'+Date.now();openParsedApp(app,true);return true;}catch(e){showRuntimeError({meta:{name:'Preview',id:'preview',icon:'!',color:'#b03b55'},source},e);return false;}}

/* -------------------------- Window manager -------------------------- */
function renderHome(){
  const hidden=getHiddenApps();const apps=getAllApps().filter(a=>!hidden.includes(a.meta.id)).sort((a,b)=>a.meta.name.localeCompare(b.meta.name));
  root.innerHTML=`<section class="screen" id="home"><div class="home-header"><div><div class="home-title">${escapeHTML(settings.homeTitle)}</div><div class="home-sub">${escapeHTML(settings.homeSubtitle)}</div></div><div class="avatar">${escapeHTML((settings.username||'O')[0].toUpperCase())}</div></div><div id="appGrid">${apps.map(a=>`<button class="app-icon-wrap" data-launch="${a.meta.id}"><span class="app-icon" style="background:linear-gradient(145deg,${a.meta.color},color-mix(in srgb,${a.meta.color} 55%,#111))">${escapeHTML(a.meta.icon)}</span><span class="app-label">${escapeHTML(a.meta.name)}</span></button>`).join('')}</div></section>`;
  document.querySelectorAll('[data-launch]').forEach(el=>el.onclick=()=>openApp(el.dataset.launch)); state.current=null;
}
function pauseCurrent(reason='navigate'){const rt=state.appInstances.get(state.current);if(rt){rt.trigger('pause',{type:'pause',reason});for(const h of rt.foregroundTimers.values()){if(h.kind==='interval')clearInterval(h.id);else clearTimeout(h.id);}rt.foregroundTimers.clear();}}
function showHome(){ if(state.current) state.history.push(state.current); pauseCurrent('home'); renderHome(); }
function openParsedApp(app,preview=false){
  const existing=state.appInstances.get(app.meta.id);if(existing)existing.destroy('relaunch');
  const rt=new MRuntime(app);state.appInstances.set(app.meta.id,rt);state.current=app.meta.id;
  if(!preview){state.recents=state.recents.filter(id=>id!==app.meta.id);state.recents.unshift(app.meta.id);state.recents=state.recents.slice(0,12);}
  log(`Opened ${app.meta.name}`);rt.mount();
  const pending=state.pendingFileOpens.get(app.meta.id);if(pending){state.pendingFileOpens.delete(app.meta.id);queueMicrotask(()=>{if(state.appInstances.get(app.meta.id)===rt)rt.trigger('openFile',pending);});}
}
function openApp(id){id=String(id);const app=getApp(id);if(!app){toast('App not found');return;}if(state.current&&state.current!==id){state.history.push(state.current);pauseCurrent('app-open');}openParsedApp(app);}
function closeRecent(id){state.recents=state.recents.filter(x=>x!==id);const rt=state.appInstances.get(id);if(rt){rt.destroy('recent-close');state.appInstances.delete(id);}if(state.current===id)showHome();}
function showRecents(){
  if(state.current)state.history.push(state.current);pauseCurrent('recents');
  const apps=state.recents.map(getApp).filter(Boolean);
  root.innerHTML=`<section class="screen" id="recents"><div class="app-header"><div class="app-header-icon" style="background:#4e5875">▢</div><div><div class="app-header-title">Recent Apps</div><div class="app-header-sub">Tap a card to reopen · close apps with ×</div></div></div>${apps.length?apps.map(a=>`<div class="recent-card" data-open-recent="${a.meta.id}"><div class="recent-top"><span>${escapeHTML(a.meta.icon)} ${escapeHTML(a.meta.name)}</span><button class="close-x" data-close-recent="${a.meta.id}" aria-label="Close">×</button></div><div class="recent-preview">${escapeHTML(a.meta.icon)}</div></div>`).join(''):'<div class="card center"><div style="font-size:2rem">▢</div><div class="row-title">No recent apps</div></div>'}</section>`;
  document.querySelectorAll('[data-open-recent]').forEach(el=>el.onclick=e=>{if(!e.target.closest('[data-close-recent]'))openApp(el.dataset.openRecent)});
  document.querySelectorAll('[data-close-recent]').forEach(el=>el.onclick=e=>{e.stopPropagation();closeRecent(el.dataset.closeRecent);showRecents();});state.current='__recents';
}
$('#navHome').onclick=()=>{vibrate();const rt=state.appInstances.get(state.current);if(rt?.trigger('homeButton',{type:'homeButton'})===true)return;showHome();};
$('#navRecents').onclick=()=>{vibrate();const rt=state.appInstances.get(state.current);if(rt?.trigger('recentsButton',{type:'recentsButton'})===true)return;showRecents();};
$('#navBack').onclick=()=>{vibrate();if($('#notificationShade').classList.contains('shade-open')){$('#notificationShade').classList.remove('shade-open');return;}const rt=state.appInstances.get(state.current);if(rt?.trigger('back',{type:'back'})===true)return;const prev=state.history.pop();if(prev&&prev!=='__recents'&&getApp(prev))openApp(prev);else showHome();};

let fpsEl=null,lastFrame=performance.now(),frames=0;
function fpsLoop(t){frames++;if(t-lastFrame>=1000){if(settings.showFPS){if(!fpsEl){fpsEl=document.createElement('div');fpsEl.style='position:absolute;top:38px;right:8px;z-index:90;background:#000a;padding:4px 7px;border-radius:8px;font:11px monospace';device.appendChild(fpsEl);}fpsEl.textContent=frames+' FPS';}else if(fpsEl){fpsEl.remove();fpsEl=null;}frames=0;lastFrame=t;}requestAnimationFrame(fpsLoop);}requestAnimationFrame(fpsLoop);

window.addEventListener('error',e=>log(`Kernel error: ${e.message}`));
log('MellorsOS kernel booted');
sanitizeInstalledApps();
renderHome();
})();
</script>
